services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: smartendorse
      POSTGRES_USER: smartendorse
      POSTGRES_PASSWORD: smartendorse
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U smartendorse"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build: .
    env_file:
      - path: .env
        required: false
    command: sh -c "python manage.py migrate && python manage.py seed_demo && gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 3 --timeout 120"
    ports:
      - "8000:8000"
    environment:
      DJANGO_SECRET_KEY: docker-dev-change-me
      DJANGO_DEBUG: "1"
      DJANGO_ALLOWED_HOSTS: "localhost,127.0.0.1"
      DATABASE_URL: "postgresql://smartendorse:smartendorse@db:5432/smartendorse"
      EMAIL_BACKEND: "${EMAIL_BACKEND:-django.core.mail.backends.console.EmailBackend}"
      EMAIL_INTAKE_AUTOSTART: "${EMAIL_INTAKE_AUTOSTART:-0}"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - media:/app/media

  mailbox-worker:
    profiles: ["email"]
    build: .
    command: python manage.py run_email_scheduler
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      DJANGO_SECRET_KEY: "${DJANGO_SECRET_KEY:-docker-dev-change-me}"
      DJANGO_ALLOWED_HOSTS: "localhost,127.0.0.1"
      DATABASE_URL: "postgresql://smartendorse:smartendorse@db:5432/smartendorse"
      EMAIL_INTAKE_AUTOSTART: "0"
    depends_on:
      db:
        condition: service_healthy
      web:
        condition: service_started
    volumes:
      - media:/app/media

volumes:
  pgdata:
  media:
