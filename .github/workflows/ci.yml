name: SmartEndorse CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      DJANGO_SECRET_KEY: ci-secret
      DJANGO_DEBUG: "0"
      DJANGO_ALLOWED_HOSTS: localhost
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Generate initial migration for validation
        run: python manage.py makemigrations core --noinput
      - run: python manage.py migrate --noinput
      - run: python manage.py check
      - run: python manage.py test
      - name: Commit generated initial migration
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          if git status --porcelain core/migrations | grep -q 0001_initial.py; then
            git config user.name "SmartEndorse CI"
            git config user.email "actions@users.noreply.github.com"
            git add core/migrations/0001_initial.py
            git commit -m "Add generated initial migration [skip ci]"
            git push
          fi
