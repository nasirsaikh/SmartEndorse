<nav class="se-panel mt-3 d-flex flex-column gap-3 p-3 flex-sm-row align-items-sm-center justify-content-sm-between" aria-label="Workflow step navigation">
  <div>
    {% if previous_step %}
    <a class="btn se-outline btn-sm" href="?step={{ previous_step.key }}#workflow-stage">
      <i class="bi bi-arrow-left"></i>
      <span><span class="d-block se-text-meta fw-normal opacity-50">PREVIOUS</span>{{ previous_step.label }}</span>
    </a>
    {% else %}
    <button class="btn se-outline btn-sm" disabled><i class="bi bi-arrow-left"></i>PREVIOUS</button>
    {% endif %}
  </div>

  <div class="text-center">
    <div class="se-eyebrow">Workflow navigation</div>
    <div class="mt-1 font-monospace glis-text-xs fw-semibold">STEP {{ selected_step_number }} OF {{ wizard_steps|length }}</div>
  </div>

  <div class="text-sm-end">
    {% if next_step %}
    <a class="btn btn-primary btn-sm" href="?step={{ next_step.key }}#workflow-stage">
      <span><span class="d-block se-text-meta fw-normal opacity-75">NEXT</span>{{ next_step.label }}</span>
      <i class="bi bi-arrow-right"></i>
    </a>
    {% else %}
    <button class="btn btn-primary btn-sm" disabled>NEXT<i class="bi bi-arrow-right"></i></button>
    {% endif %}
  </div>
</nav>
