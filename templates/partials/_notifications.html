<div class="notification-head">
  <div><strong>Notifications</strong><small>{{ unread_notifications }} unread</small></div>
  {% if unread_notifications %}
  <button class="button" hx-post="{% url 'notifications_read' %}" hx-swap="none" hx-on::after-request="htmx.trigger('#notification-panel','refresh')">Mark all read</button>
  {% endif %}
</div>
<div>
{% for note in notifications %}
  <a href="{{ note.link|default:'#' }}"
     class="notification-item {% if not note.is_read %}notification-unread{% endif %}"
     data-notification-id="{{ note.pk }}"
     data-notification-title="{{ note.title|escape }}"
     data-notification-message="{{ note.message|escape }}">
    <div class="notification-title">{{ note.title }}</div>
    <div class="notification-message">{{ note.message }}</div>
    <div class="notification-time">{{ note.created_at|timesince }} ago</div>
  </a>
{% empty %}
  <div class="notification-empty">No notifications.</div>
{% endfor %}
</div>
